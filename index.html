<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-200 min-h-screen antialiased selection:bg-blue-500/30"
  >
    <div class="max-w-5xl mx-auto px-4 py-12 relative">
      <!-- Background decorative blobs -->
      <div
        class="fixed top-0 left-10 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 pointer-events-none"
      ></div>
      <div
        class="fixed top-0 right-10 w-72 h-72 bg-emerald-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 pointer-events-none"
      ></div>

      <!-- Header -->
      <header class="mb-12 text-center relative z-10">
        <div class="absolute right-0 top-0">
          <button
            onclick="logoutUser()"
            class="bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white px-4 py-2 rounded-lg transition-colors border border-rose-500/20 text-sm font-medium flex items-center shadow-sm"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Logout
          </button>
        </div>
        <h1
          class="text-4xl md:text-5xl font-bold tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400"
        >
          User Management
        </h1>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto">
          Manage your application users from this centralized local dashboard.
        </p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-10">
        <!-- Default Form / Create / Edit -->
        <div class="lg:col-span-1">
          <div class="glass-panel p-6 rounded-2xl shadow-2xl sticky top-8">
            <h2
              id="form-title"
              class="text-xl font-semibold text-white mb-6 flex items-center"
            >
              <svg
                class="w-5 h-5 mr-2 text-blue-400 inline"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                ></path>
              </svg>
              Add New User
            </h2>

            <form id="user-form" class="space-y-4">
              <input type="hidden" id="user-id" value="" />

              <div>
                <label
                  for="username"
                  class="block text-sm font-medium text-slate-400 mb-1"
                  >Username</label
                >
                <input
                  type="text"
                  id="username"
                  required
                  class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
                  placeholder="johndoe"
                />
              </div>

              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-slate-400 mb-1"
                  >Email Address</label
                >
                <input
                  type="email"
                  id="email"
                  required
                  class="w-full bg-slate-900/80 border border-slate-700/50 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all"
                  placeholder="john@example.com"
                />
              </div>

              <div class="pt-2 flex gap-3">
                <button
                  type="submit"
                  id="submit-btn"
                  class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-900/20 transform transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900"
                >
                  Save User
                </button>
                <button
                  type="button"
                  id="cancel-btn"
                  onclick="resetForm()"
                  class="hidden px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all focus:outline-none"
                >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- User List -->
        <div class="lg:col-span-2">
          <div
            class="glass-panel p-6 rounded-2xl shadow-2xl min-h-[500px] flex flex-col"
          >
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-semibold text-white flex items-center">
                <svg
                  class="w-5 h-5 mr-2 text-emerald-400 inline"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                  ></path>
                </svg>
                Directory
                <span
                  id="user-count"
                  class="ml-3 px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700"
                  >0</span
                >
              </h2>
              <button
                onclick="fetchUsers()"
                class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
                title="Refresh"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                  ></path>
                </svg>
              </button>
            </div>

            <div
              id="loading"
              class="hidden flex-1 flex justify-center items-center py-12"
            >
              <div
                class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"
              ></div>
            </div>

            <div
              id="empty-state"
              class="hidden flex-1 text-center py-16 flex flex-col items-center justify-center"
            >
              <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 mb-4 border border-slate-700"
              >
                <svg
                  class="w-8 h-8 text-slate-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                  ></path>
                </svg>
              </div>
              <h3 class="text-lg font-medium text-slate-300">No users found</h3>
              <p class="text-slate-500 mt-1">
                Get started by creating a new user.
              </p>
            </div>

            <div id="user-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- User cards injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div
      id="toast"
      class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50"
    >
      <div
        class="bg-slate-800 border-l-4 border-emerald-500 text-white px-6 py-4 rounded shadow-2xl flex items-center"
      >
        <svg
          class="w-6 h-6 mr-3 text-emerald-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          ></path>
        </svg>
        <span id="toast-message">Success!</span>
      </div>
    </div>

    <script>
      const API_BASE = '/users';

      const form = document.getElementById('user-form');
      const userIdInput = document.getElementById('user-id');
      const usernameInput = document.getElementById('username');
      const emailInput = document.getElementById('email');
      const formTitle = document.getElementById('form-title');
      const submitBtn = document.getElementById('submit-btn');
      const cancelBtn = document.getElementById('cancel-btn');
      const userList = document.getElementById('user-list');
      const userCount = document.getElementById('user-count');
      const emptyState = document.getElementById('empty-state');
      const loadingState = document.getElementById('loading');

      document.addEventListener('DOMContentLoaded', fetchUsers);

      async function fetchUsers() {
          showLoading(true);
          try {
              const response = await fetch(API_BASE);
              if (!response.ok) throw new Error('Network error');
              const users = await response.json();
              renderUsers(users);
          } catch (error) {
              console.error('Error:', error);
              showToast('Failed to connect to backend', 'error');
          } finally {
              showLoading(false);
          }
      }

      form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = userIdInput.value;
          const userData = {
              username: usernameInput.value.trim(),
              email: emailInput.value.trim()
          };

          try {
              const url = id ? `${API_BASE}/${id}` : API_BASE;
              const method = id ? 'PUT' : 'POST';

              const response = await fetch(url, {
                  method: method,
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(userData)
              });

              if (!response.ok) {
                  const data = await response.json();
                  throw new Error(data.error || 'Server error');
              }

              showToast(id ? 'User updated successfully' : 'User created successfully', 'success');
              resetForm();
              fetchUsers();

          } catch (error) {
              showToast(error.message, 'error');
          }
      });

      async function deleteUser(id) {
          try {
              const response = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
              if (!response.ok) throw new Error('Failed to delete user');
              showToast('User deleted successfully', 'success');
              fetchUsers();
              if (userIdInput.value == id) resetForm();
          } catch (error) {
              showToast(error.message, 'error');
          }
      }

      async function logoutUser() {
          try {
              const response = await fetch('/logout', { method: 'POST' });
              if (response.ok) {
                  window.location.href = '/login';
              } else {
                  showToast('Failed to logout', 'error');
              }
          } catch (error) {
              showToast('Error during logout', 'error');
          }
      }

      function editUserPrompt(id, username, email) {
          userIdInput.value = id;
          usernameInput.value = username;
          emailInput.value = email;

          formTitle.innerHTML = `<svg class="w-5 h-5 mr-2 text-indigo-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Edit User`;
          submitBtn.textContent = 'Update User';
          submitBtn.className = 'flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-indigo-900/20 transform transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500';
          cancelBtn.classList.remove('hidden');

          if (window.innerWidth < 1024) window.scrollTo({ top: 0, behavior: 'smooth' });
          usernameInput.focus();
      }

      function resetForm() {
          userIdInput.value = '';
          form.reset();
          formTitle.innerHTML = `<svg class="w-5 h-5 mr-2 text-blue-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Add New User`;
          submitBtn.textContent = 'Save User';
          submitBtn.className = 'flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-blue-900/20 transform transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500';
          cancelBtn.classList.add('hidden');
      }

      function escapeHtml(unsafe) {
          return (unsafe || '').toString()
               .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
               .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      function renderUsers(users) {
          userList.innerHTML = '';
          userCount.textContent = users.length;

          if (users.length === 0) {
              emptyState.classList.remove('hidden');
          } else {
              emptyState.classList.add('hidden');
              users.forEach(user => {
                  const card = document.createElement('div');
                  card.className = 'bg-slate-800/80 border border-slate-700/50 p-5 rounded-xl hover:border-slate-600 transition-all group flex flex-col justify-between';

                  const initials = user.username.substring(0, 2).toUpperCase();

                  card.innerHTML = `
                      <div class="flex items-start mb-4">
                          <div class="h-10 w-10 flex-shrink-0 rounded-full bg-gradient-to-br from-blue-500 to-emerald-500 flex items-center justify-center text-white font-bold text-sm shadow-inner shadow-black/20">
                              ${initials}
                          </div>
                          <div class="ml-3 overflow-hidden">
                              <h3 class="text-white font-medium truncate">${escapeHtml(user.username)}</h3>
                              <p class="text-slate-400 text-sm truncate" title="${escapeHtml(user.email)}">${escapeHtml(user.email)}</p>
                          </div>
                      </div>
                      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-700/50 mt-auto">
                          <button onclick="editUserPrompt('${user.id}', '${escapeHtml(user.username)}', '${escapeHtml(user.email)}')" class="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-indigo-400/10 rounded transition-colors focus:outline-none" title="Edit">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                          </button>
                          <button onclick="deleteUser('${user.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-400/10 rounded transition-colors focus:outline-none" title="Delete">
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                          </button>
                      </div>
                  `;
                  userList.appendChild(card);
              });
          }
      }

      function showLoading(show) {
          loadingState.classList.toggle('hidden', !show);
          if (show) {
              userList.innerHTML = '';
              emptyState.classList.add('hidden');
          }
      }

      function showToast(message, type = 'success') {
          const toast = document.getElementById('toast');
          const toastMessage = document.getElementById('toast-message');
          const icon = toast.querySelector('svg');

          toastMessage.textContent = message;

          if (type === 'error') {
              toast.firstElementChild.className = 'bg-slate-800 border-l-4 border-rose-500 text-white px-6 py-4 rounded shadow-2xl flex items-center';
              icon.className.baseVal = 'w-6 h-6 mr-3 text-rose-500';
              icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
          } else {
              toast.firstElementChild.className = 'bg-slate-800 border-l-4 border-emerald-500 text-white px-6 py-4 rounded shadow-2xl flex items-center';
              icon.className.baseVal = 'w-6 h-6 mr-3 text-emerald-500';
              icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
          }

          toast.classList.remove('translate-y-20', 'opacity-0');
          setTimeout(() => {
              toast.classList.add('translate-y-20', 'opacity-0');
          }, 3000);
      }
    </script>
  </body>
</html>
