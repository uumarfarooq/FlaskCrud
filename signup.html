<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
</head>
<body class="bg-slate-950 font-sans text-slate-200 antialiased selection:bg-indigo-500/30">
    <div class="flex min-h-screen">
        <!-- Left Pane -->
        <div class="hidden lg:flex lg:w-1/2 relative bg-indigo-700 items-center justify-center overflow-hidden">
            <div class="absolute w-[500px] h-[500px] bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 top-10 -left-20"></div>
            <div class="absolute w-[500px] h-[500px] bg-emerald-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 -bottom-20 -right-20"></div>
            <div class="relative z-10 text-center px-12">
                <div class="mb-8 inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h1 class="text-5xl font-bold text-white mb-6">Create Account</h1>
                <p class="text-indigo-200 text-lg leading-relaxed max-w-md mx-auto">
                    Join our platform to easily manage, organize, and control user access securely.
                </p>
            </div>
        </div>
        
        <!-- Right Pane -->
        <div class="flex w-full lg:w-1/2 flex-col justify-center px-8 sm:px-16 lg:px-24 xl:px-32 relative bg-slate-950">
            <div class="max-w-md w-full mx-auto">
                <div class="mb-10 text-center lg:text-left">
                    <h2 class="text-3xl font-bold text-white">Join Us</h2>
                    <p class="text-slate-400 mt-2 text-sm md:text-base">Enter your details to register a new account.</p>
                </div>

                <form id="signupForm" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-slate-300 mb-1.5">Username</label>
                        <input type="text" id="username" class="block w-full px-4 py-3.5 bg-slate-900 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-sm" placeholder="Choose a username" required>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email</label>
                        <input type="email" id="email" class="block w-full px-4 py-3.5 bg-slate-900 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-sm" placeholder="Enter your email" required>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                        <input type="password" id="password" class="block w-full px-4 py-3.5 bg-slate-900 border border-slate-700/50 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-sm" placeholder="••••••••" required>
                    </div>
                    
                    <div id="errorMsg" class="hidden text-sm text-rose-500 bg-rose-500/10 border border-rose-500/20 px-4 py-3 rounded-lg"></div>
                    <div id="successMsg" class="hidden text-sm text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-4 py-3 rounded-lg flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span></span>
                    </div>

                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/30 text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all active:scale-[0.98]">
                        Sign Up
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-800 text-center">
                    <p class="text-slate-400 text-sm">
                        Already have an account? <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                const successMsg = document.getElementById('successMsg');
                successMsg.querySelector('span').textContent = "Account created. Redirecting to login...";
                successMsg.classList.remove('hidden');
                document.getElementById('errorMsg').classList.add('hidden');
                setTimeout(() => { window.location.href = '/login'; }, 1500);
            } else {
                const errorMsg = document.getElementById('errorMsg');
                errorMsg.textContent = data.error;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
